<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password – 2 Player</title>
<style>
:root{--bg:#14110f;--card:#221d19;--tx:#f5ede6;--mu:#9a8d82;--ac:#ff8a2b;--ok:#2fb86a;--no:#d9534f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);display:flex;flex-direction:column;max-width:480px;margin:auto}
h1{font-size:1.5rem;margin:18px 0 4px;color:var(--ac)}
p.s{color:var(--mu);margin:0 0 16px;font-size:.9rem}
label{display:block;font-size:.8rem;color:var(--mu);margin:14px 0 6px}
input{width:100%;padding:14px;font-size:1.1rem;border-radius:12px;border:2px solid #3a322b;background:var(--card);color:var(--tx)}
input.code{text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:1.4rem}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px;color:#fff;background:var(--ac);font-size:1.05rem}
button.alt{background:var(--card);border:2px solid #3a322b}
button.sel{border-color:var(--ac);color:var(--ac)}
button.ok{background:var(--ok)}button.no{background:var(--no)}
button:active{transform:scale(.97)}
.screen{display:none;flex:1;flex-direction:column}.screen.on{display:flex}
.big{font-size:5rem;font-weight:800;text-align:center;word-break:break-word;line-height:1.1}
.card{background:var(--card);border-radius:20px;padding:24px 12px;margin:14px 0;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-weight:800;font-size:1.8rem}
.bar{height:8px;background:#3a322b;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);width:100%}
.mu{color:var(--mu);font-size:.85rem}
.fp{font-weight:800;color:var(--ac);letter-spacing:.15em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.btns button{padding:26px 8px;font-size:1.3rem}
</style>
</head>
<body>

<div id="setup" class="screen on">
  <h1>Password</h1>
  <p class="s">Two phones, one room code. Enter the same code on both.</p>
  <label>Room seed code</label>
  <div class="row"><input id="code" class="code" maxlength="20" placeholder="CODE" autocapitalize="characters"><button class="alt" id="rnd" style="flex:0 0 auto">🎲</button></div>
  <div class="row">
    <div><label>Words to get</label><input id="target" type="number" min="1" max="50" value="10" inputmode="numeric"></div>
    <div><label>Seconds</label><input id="secs" type="number" min="10" max="600" value="60" inputmode="numeric"></div>
  </div>
  <label>Your role this round</label>
  <div class="row"><button class="alt sel" id="rGive">🗣 Clue-giver<br><small>sees the word</small></button><button class="alt" id="rGuess">🤔 Guesser<br><small>sees the letter</small></button></div>
  <div style="flex:1"></div>
  <button id="go" style="margin:16px 0">Continue</button>
</div>

<div id="ready" class="screen">
  <h1 id="rTitle"></h1>
  <p class="s">Round <b id="rRound"></b> · Check code <span class="fp" id="rFp"></span><br>Both phones must show the same check code. If not, re-enter the seed code and settings.</p>
  <div class="card"><div class="mu">Both players tap Start together</div><div class="big" id="cd" style="font-size:3rem">Ready?</div></div>
  <button id="start">Start</button>
  <button class="alt" id="back" style="margin:10px 0 16px">Back</button>
</div>

<div id="play" class="screen">
  <div class="top"><span id="tm">60</span><span id="sc">0/10</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card"><div class="mu" id="lbl"></div><div class="big" id="word"></div></div>
  <div class="btns"><button class="ok" id="okb">✓ Correct</button><button class="no" id="passb">Pass ⏭</button></div>
  <button class="alt" id="undo" style="margin-bottom:16px">↩ Undo last</button>
</div>

<div id="result" class="screen">
  <h1 id="resT"></h1>
  <div class="card"><div class="big" id="resS"></div><div class="mu" id="resD"></div></div>
  <button id="next">Next round (swap roles)</button>
  <button class="alt" id="again" style="margin:10px 0">Replay this round</button>
  <button class="alt" id="menu" style="margin-bottom:16px">Change settings</button>
</div>

<script src="room-seeder.js"></script>
<script>
const WORDS=`apple anchor angel arrow attic autumn bacon badge bakery balloon banana barn basket beach beard bell bench bicycle bird blanket boat bone book boot bottle bowl branch bread bridge broom brush bubble bucket button cabin cactus cake camel camera candle canyon carpet castle cave chair cheese cherry chicken chimney circus clock cloud clown coconut coffee comet compass cookie copper cotton cow crab crayon crown cupboard curtain dagger dancer desert diamond dinosaur doctor dolphin donkey dragon drawer dress drum duck eagle earth engine fabric factory farmer feather fence ferry field finger fire fish flag flower forest fork fountain fox frog garden garlic ghost giant giraffe glove goat gold grape grass guitar hammer harbor hat hawk helmet honey horse hospital hotel island jacket jelly jewel jungle kettle key kitchen kite knife ladder lake lamp lemon lettuce library lighthouse lion lizard lobster magnet mango map market mask meadow melon mirror monkey moon mountain mouse mushroom needle nest night noodle ocean onion orange oven owl paddle painter palace panda paper parade parrot peach pearl pencil penguin piano pickle pillow pilot pirate pizza planet plate pocket potato pumpkin puzzle queen rabbit radio rainbow raven river robot rocket roof rope saddle sailor salad sandwich scarf school scissors shadow shark sheep shell shield ship shoe shovel silver singer skeleton snake snow soldier spider spoon squirrel stairs star statue storm street sugar summer sunset swamp sword table teacher tent thunder ticket tiger toast tomato tower tractor train treasure tree trumpet tunnel turtle umbrella valley vase village violin volcano wagon wallet walnut watch water whale wheel whistle window winter wizard wolf yacht zebra
angry ancient bright brave busy calm careful clever cold cozy crazy cruel curious dark dirty dizzy dry eager empty fancy fast fierce fragile friendly funny gentle giant greedy grumpy happy heavy honest hungry icy jealous kind lazy lonely loud lucky messy mighty narrow noisy nervous polite proud quiet rich rough rude sad scary shiny shy silly sleepy slippery smooth sneaky sour spicy sticky strange sweet tall tiny tired ugly wet wild wise
adventure alarm argument audience balance battle birthday blizzard budget captain career carnival chapter charity chorus coach comedy contest cousin crisis danger debate dream earthquake echo energy escape evening exam fantasy festival freedom friend future giggle glory habit holiday honor hunger idea journey judge justice kingdom language laughter legend lesson magic memory message mission mystery nightmare ocean office opinion paradise passport patience picnic poem prison promise puzzle rumor secret season silence slumber souvenir spirit sunrise surprise talent theater thief tradition trouble vacation victory voyage weekend whisper wisdom wonder
bake bounce climb dance dig dive drift float gallop hike jump juggle kneel march paint race roar sail skate sleep slide sneeze spin splash swim tickle whisper wiggle yawn`.split(/\s+/);

const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))};
let S={role:'give',round:1,deck:[],i:0,score:0,hist:[],end:0,total:60,target:10,tick:null,code:''};

function setRole(r){S.role=r;$('rGive').classList.toggle('sel',r==='give');$('rGuess').classList.toggle('sel',r==='guess')}
$('rGive').onclick=()=>setRole('give');$('rGuess').onclick=()=>setRole('guess');
$('rnd').onclick=()=>{$('code').value=RoomSeeder.randomCode()};

function prep(){
  S.code=RoomSeeder.normalize($('code').value);
  S.target=Math.max(1,+$('target').value||10);S.total=Math.max(10,+$('secs').value||60);
  S.deck=RoomSeeder.deck(WORDS,S.code,S.round);
  S.i=0;S.score=0;S.hist=[];
  $('rTitle').textContent=S.role==='give'?'🗣 You are the Clue-giver':'🤔 You are the Guesser';
  $('rRound').textContent=S.round;$('rFp').textContent=RoomSeeder.fingerprint(S.deck)+'-'+S.target+'/'+S.total;
  $('cd').textContent='Ready?';$('start').disabled=false;
  show('ready');
}
$('go').onclick=()=>{if(!RoomSeeder.normalize($('code').value)){$('code').focus();return}S.round=1;prep()};
$('back').onclick=()=>show('setup');
$('menu').onclick=()=>show('setup');
$('again').onclick=prep;
$('next').onclick=()=>{S.round++;setRole(S.role==='give'?'guess':'give');prep()};

$('start').onclick=()=>{
  $('start').disabled=true;let n=3;$('cd').textContent=n;
  const c=setInterval(()=>{n--;if(n>0)$('cd').textContent=n;else{clearInterval(c);begin()}},1000);
};
function begin(){
  show('play');S.end=Date.now()+S.total*1000;render();
  S.tick=setInterval(()=>{
    const left=Math.max(0,S.end-Date.now());
    $('tm').textContent=Math.ceil(left/1000);$('bar').style.width=(left/(S.total*10))+'%';
    if(left<=0)finish(false);
  },100);
}
function cur(){return S.deck[S.i%S.deck.length]}
function render(){
  $('sc').textContent=S.score+'/'+S.target;
  if(S.role==='give'){$('lbl').textContent='Give 1-word clues for:';$('word').textContent=cur().toUpperCase()}
  else{$('lbl').textContent='The word starts with:';$('word').textContent=cur()[0].toUpperCase()}
  $('okb').textContent=S.role==='give'?'✓ Correct':'✓ Got it';
}
function step(ok){
  S.hist.push(ok);S.i++;if(ok)S.score++;
  if(S.score>=S.target){finish(true);return}
  render();
}
$('okb').onclick=()=>step(true);
$('passb').onclick=()=>step(false);
$('undo').onclick=()=>{if(!S.hist.length)return;const ok=S.hist.pop();S.i--;if(ok)S.score--;render()};

function finish(win){
  clearInterval(S.tick);
  const left=Math.max(0,Math.round((S.end-Date.now())/1000));
  $('resT').textContent=win?'🎉 You did it!':"⏰ Time's up!";
  $('resS').textContent=S.score+'/'+S.target;
  $('resD').textContent=win?left+'s left on the clock':'Passes: '+S.hist.filter(h=>!h).length;
  show('result');
}
</script>
</body>
</html>
